# REFERENTIEL FICTIF. Personnes inventees, adresses inventees, dates calees sur un faux depot.
# Rien ici ne designe une personne reelle, et aucun document delivre a quiconque n'entre dans
# ce depot: le corpus est fait de formulaires VIERGES tels que l'administration les publie.

dossier: DP-2026-0417

# DEUX HORLOGES. La meme piece peut etre bonne pour un dossier et perimee pour l'autre au
# meme instant. Un outil qui n'a qu'une horloge se trompe la moitie du temps.
horloges:
  guichet: 2026-08-21        # la date qui refuse
  recevabilite: 2026-02-10   # une autre date de reference, ou la meme piece passe

personne:
  nom: QUISPE VARGAS
  prenom: MARISOL
  date_naissance: 14/03/1991
  ville_naissance: COMMENTRY
  numero_fiscal: 412-88-7305
  numero_secu: 461-72-9058
  numero_carte: AB1234567
  adresse:
    numero: "128"
    type_voie: RUE
    nom_voie: DES ACACIAS
    code_postal: "03600"
    ville: COMMENTRY

# Ce qui ne doit JAMAIS reapparaitre sur une piece. Le premier est le numero d'exemple
# imprime dans la notice du formulaire: le recopier est un motif de refus classique.
valeurs_interdites:
  - 999-99-9999
  - A COMPLETER

validite:
  # Date portee par la piece emploi. Saine, elle depasse les deux horloges. Perimee, elle
  # tombe ENTRE les deux: refusee au guichet, acceptee a la date de recevabilite.
  date_expiration_saine: 31/12/2027
  date_expiration_perimee: 31/05/2026

pieces:
  - id: fiscal
    gabarit: fw9
  - id: emploi
    gabarit: i9
  - id: identite
    gabarit: cerfa14011

# Meme donnee, deux pieces. Si elles divergent, le guichet refuse les deux.
coherences:
  - donnee: nom_voie
    lectures:
      - {piece: fiscal, champ: adresse}
      - {piece: identite, champ: nom_voie}
