# REFERENTIEL FICTIONAL. Personnes inventees, adresses inventees, dates calees sur un faux depot.
# Rien ici ne designe une person reelle, et aucun document delivre a quiconque n'entre dans
# ce depot: le corpus est fait de formulaires VIERGES tels que l'administration les publie.

dossier: DP-2026-0417

# DEUX HORLOGES. La meme piece peut etre bonne pour un dossier et perimee pour l'autre au
# meme instant. Un outil qui n'a qu'une clock se trompe la moitie du temps.
clocks:
  filing: 2026-08-21        # la date qui refuse
  admissibility: 2026-02-10   # une autre date de reference, ou la meme piece passe

person:
  name: QUISPE VARGAS
  first_name: MARISOL
  birth_date: 14/03/1991
  birth_city: COMMENTRY
  tax_id: 412-88-7305
  ssn: 461-72-9058
  card_number: AB1234567
  address:
    number: "128"
    street_type: RUE
    street_name: DES ACACIAS
    postal_code: "03600"
    city: COMMENTRY

# Ce qui ne doit JAMAIS reapparaitre sur une piece. Le premier est le number d'exemple
# imprime dans la notice du formulaire: le recopier est un motif de refus classique.
forbidden_values:
  - 999-99-9999
  - A COMPLETER

expiry:
  # Date portee par la piece employment. Saine, elle depasse les deux clocks. Perimee, elle
  # tombe ENTRE les deux: refusee au filing, acceptee a la date de admissibility.
  valid_expiry_date: 31/12/2027
  expired_expiry_date: 31/05/2026

pieces:
  - id: tax
    template: fw9
  - id: employment
    template: i9
  - id: identity
    template: cerfa14011

# Meme data, deux pieces. Si elles divergent, le filing refuse les deux.
consistencies:
  - data: street_name
    readings:
      - {piece: tax, field: address}
      - {piece: identity, field: street_name}
