# THIS CI HAD NEVER RUN when it was written: the repo had only just acquired a remote. Its
# first run is therefore itself a measurement, and it may go red for a reason that is not a
# regression: the thresholds were read under tesseract 5.5.1 locally, and ubuntu-latest ships
# a different version. If a text check moves here and nowhere else, the cause is the OCR
# version and not a threshold. Never move a value in thresholds.json to make this file green:
# a threshold moves because the grid says so.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # tesseract-ocr alone only ships English. Without -fra the Cerfa's fields come out EMPTY
      # and the tests fail unreadably, never once saying "missing language".
      - name: system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra poppler-utils
          tesseract --version
          pdftoppm -v

      - name: install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: the corpus manifest holds
        run: python -m pytest tests/test_corpus.py -q

      - name: the suite
        run: python -m pytest -q

      - name: the first green case
        run: python spike/proof.py

      # `pip install -e .` laid down a console script: check it really exists, otherwise the
      # entry point is only an entry point from a clone.
      - name: the console script is installed
        run: dossier-preflight --help

# grid/run.py is NOT here and must not come here: two hours on thirteen workers.
