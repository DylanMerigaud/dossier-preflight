# CETTE CI N'A JAMAIS TOURNE au moment ou elle est ecrite: le depot venait d'acquerir un
# remote. Son premier run est donc lui-meme une mesure, et il peut rougir pour une raison
# qui n'est pas une regression: les thresholds ont ete lus sous tesseract 5.5.1 en local, et
# ubuntu-latest en fournit une autre version. Si un check de texte bouge ici et nulle part
# ailleurs, la cause est la version d'OCR et pas un seuil. Ne deplacer aucune value de
# thresholds.json pour verdir ce fichier: un seuil se deplace parce que la grid le dit.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # tesseract-ocr seul ne fournit que l'anglais. Sans -fra, les fields du Cerfa sortent
      # VIDES et les tests echouent de facon illisible, sans jamais dire "language manquante".
      - name: dependances systeme
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra poppler-utils
          tesseract --version
          pdftoppm -v

      - name: installer
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: le manifeste de corpus tient
        run: python -m pytest tests/test_corpus.py -q

      - name: la suite
        run: python -m pytest -q

      - name: le premier cas vert
        run: python spike/proof.py

      # `pip install -e .` a pose un script console: verifier qu'il existe vraiment, sinon
      # le point d'entree n'est un point d'entree que from_dict un clone.
      - name: le script console est installe
        run: dossier-preflight --help

# grid/run.py n'est PAS ici et ne doit pas y venir: deux heures sur treize processus.
