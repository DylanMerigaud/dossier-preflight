[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dossier-preflight"
version = "0.1.0"
description = "Is this dossier going to be rejected at the counter: conformity measured on what is actually printed"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Dylan Merigaud" }]
keywords = ["ocr", "pdf", "acroform", "compliance", "forms"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: PDF",
]

# The core, and nothing else. matplotlib is used ONLY by grid/analyze.py to plot the curves:
# declaring it here would suggest a heavier runtime than this actually is.
dependencies = [
    "numpy>=1.24",
    "pillow>=10",
    "pypdf>=4",
    "pyyaml>=6",
    "scipy>=1.10",
]

[project.optional-dependencies]
grid = ["matplotlib>=3.7"]          # only for grid/analyze.py
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/DylanMerigaud/dossier-preflight"

[project.scripts]
dossier-preflight = "preflight.__main__:main"

# TWO SYSTEM DEPENDENCIES, AND PIP INSTALLS NEITHER:
#   tesseract >= 5, with the eng AND fra language data (the Cerfa is in French; without
#     tesseract-ocr-fra its fields come out EMPTY, with no error message, which looks like a
#     dossier defect and is not one)
#   poppler (pdftoppm), to rasterise the PDFs
# macOS:  brew install tesseract tesseract-lang poppler
# Debian: apt-get install tesseract-ocr tesseract-ocr-fra poppler-utils
#
# reportlab is NOT a dependency and must not become one: the fixtures' text and signature are
# laid down by a hand-written PDF stream merged by pypdf, precisely to avoid adding it.

[tool.setuptools]
# `grid/` is not packaged: it is the measurement rig, it runs from a clone.
packages = ["preflight"]
